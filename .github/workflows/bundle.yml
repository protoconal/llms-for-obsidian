name: bundle
# Builds per-platform plugin bundles containing main.js plus the pinned sqlite-vec
# extension (installed from package-lock.json, integrity-checked by npm).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  SQLITE_VEC_VERSION: 0.1.9
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify sqlite-vec pin
        run: |
          test "$(node -p "require('./package.json').dependencies['sqlite-vec']")" = "$SQLITE_VEC_VERSION"
          test "$(node -p "require('./package-lock.json').packages['node_modules/sqlite-vec'].version")" = "$SQLITE_VEC_VERSION"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: main-js
          path: |
            main.js
            manifest.json
  bundle:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, sqlite: linux-x64, sha: 555635de98534d87a67ee2e6e1b0d79f494b1b33b223477d3e7a8ea0c66e416f }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: darwin-x64, os: macos-15-intel, sqlite: osx-x64, sha: 6a65ac5bff00b0b5251239462dffc70e704bcf1a49e603d5af9fb2812556d113 }
          - { name: darwin-arm64, os: macos-latest, sqlite: osx-arm64, sha: a3106c6db3b50ec9ef4fde4edfafe7504179e9bfd7e0816a280b29c4d56a2e7b }
          - { name: windows-x64, os: windows-latest, sqlite: win-x64, sha: e171f3993a992edf076746926dd52b5e2ebfabaee38818e74987e1d8112ab987 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: main-js
          path: dist
      - name: Install pinned production dependencies
        run: |
          cp package.json package-lock.json dist/
          cd dist
          npm ci --omit=dev --ignore-scripts
      - name: Verify extension binary and version
        working-directory: dist
        run: |
          node -e "
            const v = require('sqlite-vec');
            const p = v.getLoadablePath();
            if (!require('fs').existsSync(p)) throw new Error('missing ' + p);
            if (require('./node_modules/sqlite-vec/package.json').version !== process.env.SQLITE_VEC_VERSION) throw new Error('version mismatch');
            console.log(p);
          "
      - name: Bundle sqlite3 CLI
        if: matrix.sqlite
        working-directory: dist
        run: |
          curl -fsSL -o tools.zip "https://www.sqlite.org/2026/sqlite-tools-${{ matrix.sqlite }}-3540100.zip"
          node -e "
            const h = require('crypto').createHash('sha3-256').update(require('fs').readFileSync('tools.zip')).digest('hex');
            if (h !== '${{ matrix.sha }}') throw new Error('sqlite-tools hash mismatch: ' + h);
          "
          mkdir -p bin
          node -e "
            const {execFileSync} = require('child_process');
            execFileSync(process.platform === 'win32' ? 'powershell' : 'unzip', process.platform === 'win32'
              ? ['-Command', 'Expand-Archive tools.zip -DestinationPath tools'] : ['-q', 'tools.zip', '-d', 'tools']);
          "
          cp tools/sqlite3* bin/
          chmod +x bin/sqlite3* || true
          rm -rf tools tools.zip
          ls bin
      - name: Package
        run: |
          mkdir -p out/llms-for-obsidian
          cp -R dist/. out/llms-for-obsidian/
          cd out
          node -e "
            const {execFileSync} = require('child_process');
            if (process.platform === 'win32') execFileSync('powershell', ['-Command', 'Compress-Archive -Path llms-for-obsidian -DestinationPath ../llms-for-obsidian-${{ matrix.name }}.zip']);
            else execFileSync('zip', ['-qr', '../llms-for-obsidian-${{ matrix.name }}.zip', 'llms-for-obsidian']);
          "
      - uses: actions/upload-artifact@v4
        with:
          name: llms-for-obsidian-${{ matrix.name }}
          path: llms-for-obsidian-${{ matrix.name }}.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: llms-for-obsidian-*
          merge-multiple: true
          path: release
      - run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
